[tool.pytest.ini_options]
# Coverage flags (--cov-fail-under=40) are enforced in CI via the test job command.
# Running locally without pytest-cov installed still works cleanly.
addopts = "-v"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long — handled by formatter
    "F401",  # unused imports in __init__ files
]
exclude = [
    "football_analytics_engine/dbt_project/",
    ".github/",
]
