version: 2

models:
  - name: mart_player_metrics
    description: "Per-player aggregated passing and xT/xP metrics"
    columns:
      - name: player_id
        tests: [not_null]

  - name: mart_team_summary
    description: "Per-team action volume and threat metrics"
    columns:
      - name: team_id
        tests: [unique, not_null]

  - name: mart_match_summary
    description: "Per-match scoreline, action counts, and total xT"
    columns:
      - name: match_id
        tests: [unique, not_null]

  - name: mart_competition_leaderboard
    description: "Cross-competition player xT leaderboard"

  - name: mart_pressing_metrics
    description: "PPDA (Passes Per Defensive Action) per team per match — pressing intensity metric"
    columns:
      - name: match_id
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: ppda
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true

  - name: mart_pass_network
    description: "Pass network aggregation — from/to player pair counts per match"
    columns:
      - name: match_id
        tests: [not_null]
      - name: from_player_id
        tests: [not_null]
      - name: to_player_id
        tests: [not_null]
      - name: pass_count
        tests:
          - dbt_utils.accepted_range:
              min_value: 2
              inclusive: true
