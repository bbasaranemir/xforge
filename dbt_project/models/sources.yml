version: 2

sources:
  - name: public
    description: >
      Raw tables written by Python ML scripts — not managed by dbt.
      fact_events, dim_players, dim_teams are defined in staging/schema.yml.
    schema: public
    tables:
      - name: set_piece_clusters
        description: >
          K-Means cluster centroids for corner and shot locations.
          Written by scripts/tactical_models.py (k=6 per event type).
        columns:
          - name: event_type
            tests: [not_null]
          - name: cluster_label
            tests: [not_null]

      - name: player_similarity_scores
        description: >
          Top-10 cosine-similarity scores per player across 12 aggregated
          features. Written by scripts/player_similarity.py.
        columns:
          - name: player_id
            tests: [not_null]
          - name: similar_player_id
            tests: [not_null]
          - name: similarity_score
            tests: [not_null]
